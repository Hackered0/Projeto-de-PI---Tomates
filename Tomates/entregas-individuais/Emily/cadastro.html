<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TomatoMetrics - Login</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
</head>
<body>
    <div class="main-cadastro">
        <div class="left-cadastro">
            <h1>Cultive sua conexão<br>E entre para o nosso time</h1>
            <!-- <img src="tomate3.png" class="img-tomate3" alt="tomate3"> -->
            <img src="sign-up-animate.svg" class="img" alt="Ilustração de Login">
        </div>

        <div class="right-cadastro">
            <div class="card-cadastro">
                <img src="tomate.png" class="img1-tomate1" alt="tomate">
                <img src="tomate2.png" class="img2-tomate2" alt="tomate2">
                <h1>Cadastrar</h1>
                
                <div class="textfield">
                    <label for="usuario">Usuário</label>
                    <div class="input-container">
                        <i class='bx bx-user'></i>
                        <input type="text" name="usuario" placeholder="Username" required>
                    </div>
                </div>

                <div class="textfield">
                    <label for="senha">Email</label>
                    <div class="input-container">
                        <i class="bx bx-envelope"></i>
                        <input type="email" name="email" placeholder="Email" required>
                    </div>
                </div>
                <div class="textfield">
                    <label for="usuario">Senha</label>
                    <div class="input-container">
                        <i class='bx bx-user'></i>
                        <input type="password" name="senha" placeholder="Senha" required>
                    </div>
                </div>

            

                <button type="submit" class="btn-login">Acessar Estufa</button>

                <div class="register">
                    <p>Já tem uma conta? <a href="#">Login</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
