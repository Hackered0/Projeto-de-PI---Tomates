<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dashboard.css">
    <title>Dashboard Tomato</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>



</head>

<body>
    <header>
        <div class="logo">
            <img src="../Site/imagens/TM.png" alt="" />
            <h1>TomatoMetrics</h1>
        </div>
        <nav>

            <a href="index.html">Home</a>

        </nav>
    </header>

    <div class="container">

        <div class="barra">
            <img src="/Tomates/entrega-oficial/Site/imagens/user.png" alt="imagem_usuario">
            <h2>Nome Usuário</h2>
            <ul>
                <li>Estufas</li>
                <li>Colaboradores</li>
                <li>Relatórios</li>
                <li> Como Usar </li>
                <li>Configurações</li>
            </ul>
        </div>
    </div>


    <div class="conteudo">

        <select id="filtroPeriodo">
            <option value="hoje">📅 Hoje</option>
            <option value="semana">📅 Semana</option>
            <option value="mes">📅 Mês</option>
        </select>

        <select id="filtroPeriodo">
            <option value="estufa1">🍅 Estufa 01</option>
            <option value="estufa2">🍅 Estufa 02</option>
            <option value="estufa3">🍅 Estufa 03</option>
        </select>

        <div class="cards">

            <div class="card alerta">
                <div class="icon">⚠️</div>
                <div class="info">
                    <p>Alertas Emitidos Hoje</p>
                    <h2>4</h2>
                    <a href="#">Ver detalhes →</a>
                </div>
            </div>

            <div class="card azul">
                <div class="icon">🌡️</div>
                <div class="info">
                    <p>Temperatura Média</p>
                    <h2>21°C</h2>
                    <span class="status">● Estável</span>
                </div>
            </div>

            <div class="card verde">
                <div class="icon">💧</div>
                <div class="info">
                    <p>Umidade do Ar Média</p>
                    <h2>55%</h2>
                    <span class="status">● Estável</span>
                </div>
            </div>

            <div class="card verde">
                <div class="icon">🌱</div>
                <div class="info">
                    <p>Umidade do Solo Média</p>
                    <h2>73%</h2>
                    <span class="status">● Ideal</span>
                </div>
            </div>

        </div>

        <div class="graficos">

            <div class="grafico">
                <canvas id="grafico_temperatura"></canvas>
            </div>

            <div class="grafico">
                <canvas id="grafico_umidade"></canvas>
            </div>

            <div class="grafico">
                <canvas id="grafico_umidade_solo"></canvas>
            </div>

            <div class="grafico medias">
                <canvas id="graficoMedias"></canvas>
            </div>

        </div>

    </div>


    <script>
        const grafico_temperatura = document.getElementById('grafico_temperatura');
        const grafico_umidade = document.getElementById('grafico_umidade');
        const grafico_umidade_solo = document.getElementById('grafico_umidade_solo');


        const chartTemperatura = new Chart(grafico_temperatura, {
            type: "line",
            data: {
                labels: ['12:00', '12:05', '12:10', '12:15', '12:20', '12:25'],
                datasets: [{
                    label: "Temperatura (°C)",
                    data: [30, 29, 28, 25, 22, 23],
                    borderWidth: 2,
                    borderColor: '#FF6384',
                    backgroundColor: '#FF6384',
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });


        const chartUmidade = new Chart(grafico_umidade, {
            type: "line",
            data: {
                labels: ['12:00', '12:05', '12:10', '12:15', '12:20', '12:25'],
                datasets: [{
                    label: "Umidade (%)",
                    data: [50, 52, 55, 55, 58, 61],
                    borderWidth: 2,
                    borderColor: '#87CEFA',
                    backgroundColor: '#87CEFA',
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });


        const chartSolo = new Chart(grafico_umidade_solo, {
            type: "line",
            data: {
                labels: ['12:00', '12:05', '12:10', '12:15', '12:20', '12:25'],
                datasets: [{
                    label: "Umidade do Solo (%)",
                    data: [70, 75, 72, 70, 71, 78],
                    borderWidth: 2,
                    borderColor: '#4BC0C0',
                    backgroundColor: '#4BC0C0',
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        const graficoMedias = document.getElementById('graficoMedias');

        const chartMedias = new Chart(graficoMedias, {
            type: "bar",
            data: {
                labels: ["Temperatura Média (Cº)", "Umidade Média(%)", "Umidade do Solo(%)"],
                datasets: [{
                    label: "Médias",
                    data: [26, 55, 73],
                    backgroundColor: [
                        "#f77f00", // temperatura
                        "#4cc9f0", // umidade
                        "#52b788"  // solo
                    ],
                    borderRadius: 8
                }]
            },
            options: {
                plugins: {
                    legend: {
                        display: false
                    }
                },


            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
        });
    </script>

</body>

</html>
