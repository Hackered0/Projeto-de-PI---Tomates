<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TomatoMetrics - Login</title>
    <link rel="stylesheet" href="./css/login.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <div class="main-login">
        <img src="./imagens/tomate.png" class="img-tomate" alt="tomate">
        <img src="./imagens/tomate2.png" class="img-tomate2" alt="tomate2">

        <div class="left-login">
            <h1>Cultive sua conexão<br>E entre para o nosso time</h1>
            <img src="./imagens/mobile-login-animate.svg" class="img">
        </div>

        <form>
            <div class="right-login">
                <div class="card-login">

                    <h1>LOGIN</h1>

                    <!-- USUÁRIO -->
                    <div class="textfield">
                        <label>E-mail</label>
                        <div class="input-container">
                            <i class='bx bx-user'></i>
                            <input type="text" id="email" name="email" placeholder="E-mail">
                        </div>
                        <span id="erro_usuario"></span>
                    </div>

                    <!-- SENHA -->
                    <div class="textfield">
                        <label>Senha</label>
                        <div class="input-container">
                            <i class='bx bx-lock-alt'></i>
                            <input type="password" id="senha" name="senha" placeholder="Password">
                        </div>
                        <span id="erro_senha"></span>
                    </div>

                    <button type="button" class="btn-login"
                    onclick="entrar()">
                        Acessar Estufa
                    </button>

                    <div class="register">
                        <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
                    </div>

                </div>
            </div>
        </form>
    </div>

<script>

    function entrar() {
       
            let valorusuario = email.value;
            let valorsenha = senha.value;
            console.log("To no fetch")
            fetch("/usuarios/autenticar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    emailServer: valorusuario,
                    senhaServer: valorsenha
                })
            }).then(function (resposta) {
                console.log("ESTOU NO THEN DO entrar()!")

                if (resposta.ok) {
                    console.log(resposta);

                    resposta.json().then(json => {
                        console.log(json);
                        console.log(JSON.stringify(json));
                        sessionStorage.EMAIL_USUARIO = json.email;
                        sessionStorage.NOME_USUARIO = json.nome;
                        sessionStorage.ID_USUARIO = json.id;
                        /* sessionStorage.FICHAS = JSON.stringify(json.fichas) */

                        setTimeout(function () {
                            window.location = "./visaoGeral.html";
                        }, 1000); // apenas para exibir o loading

                    });

                } else {

                    console.log("Houve um erro ao tentar realizar o login!");

                    resposta.text().then(texto => {
                        console.error(texto);

                    });
                }

            }).catch(function (erro) {
                console.log(erro);
            })

            return false;
        

    }
</script>

</body>
</html>
