<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TomatoMetrics - Login</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <div class="main-login">
        <img src="tomate.png" class="img-tomate" alt="tomate">
        <img src="tomate2.png" class="img-tomate2" alt="tomate2">

        <div class="left-login">
            <h1>Cultive sua conexão<br>E entre para o nosso time</h1>
            <img src="mobile-login-animate.svg" class="img">
        </div>

        <form>
            <div class="right-login">
                <div class="card-login">

                    <h1>LOGIN</h1>

                    <!-- USUÁRIO -->
                    <div class="textfield">
                        <label>Usuário</label>
                        <div class="input-container">
                            <i class='bx bx-user'></i>
                            <input type="text" id="usuario" name="usuario" placeholder="Username">
                        </div>
                        <span id="erro_usuario"></span>
                    </div>

                    <!-- SENHA -->
                    <div class="textfield">
                        <label>Senha</label>
                        <div class="input-container">
                            <i class='bx bx-lock-alt'></i>
                            <input type="password" id="senha" name="senha" placeholder="Password">
                        </div>
                        <span id="erro_senha"></span>
                    </div>

                    <button type="button" class="btn-login"
                    onclick="validarFormulario(usuario, senha, erro_usuario, erro_senha)">
                        Acessar Estufa
                    </button>

                    <div class="register">
                        <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
                    </div>

                </div>
            </div>
        </form>
    </div>

<script>
function validarFormulario(usuario, senha, erro_usuario, erro_senha) {

    let valorusuario = usuario.value;
    let valorsenha = senha.value;

    let temMaiuscula = /[A-Z]/.test(valorsenha);
    let temEspecial = /[^A-Za-z0-9]/.test(valorsenha);


    erro_usuario.innerHTML = "";
    erro_senha.innerHTML = "";


    let valido = true;

    if (valorusuario == "") {
        erro_usuario.innerHTML = "Preencha o usuário";
        erro_usuario.style.color = "red";
        valido = false;
    }

    if (valorsenha == "") {
        erro_senha.innerHTML = "Preencha a senha";
        erro_senha.style.color = "red";
        valido = false;
    } else if (valorsenha.length < 9) {
        erro_senha.innerHTML = "Mínimo 9 caracteres";
        erro_senha.style.color = "red";
        valido = false;
    } else if (!temMaiuscula) {
        erro_senha.innerHTML = "Precisa de letra maiúscula";

        valido = false;
    } else if (!temEspecial) {
        erro_senha.innerHTML = "Precisa de caractere especial";
        erro_senha.style.color = "red";
        valido = false;
    }

    if (valido) {
        alert("Login realizado!");
        window.location.href = "dashboard_tomates.html";
    }
}
</script>

</body>
</html>
