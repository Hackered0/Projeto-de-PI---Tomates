<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TomatoMetrics - Login</title>
    <link rel="stylesheet" href="cadastro.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="cadastro.html">
</head>

<body>
    <div class="main-login">
        <img src="../Site/imagens/tomate.png" class="img-tomate" alt="tomate">
        <img src="../Site/imagens/tomate2.png" class="img-tomate2" alt="tomate2">
        <div class="left-login">
            <h1>Cultive sua conexão<br>E entre para o nosso time</h1>
            <!-- <img src="tomate3.png" class="img-tomate3" alt="tomate3"> -->
            <img src="../Site/imagens/mobile-login-animate.svg" class="img" alt="Ilustração de Login">
        </div>
        <form>
            <div class="right-login">
                <div class="card-login">

                    <h1>LOGIN</h1>

                    <div class="textfield">
                        <label for="usuario">Usuário</label>
                        <div class="input-container">
                            <i class='bx bx-user'></i>
                            <input type="text" id="usuario" name="usuario" placeholder="Username" required>
                            <span id="erro-usuario" class="erro-usuario"></span>
                        </div>
                    </div>

                    <div class="textfield">
                        <label for="senha">Senha</label>
                        <div class="input-container">

                            <i class='bx bx-lock-alt'></i>
                            <input type="password" id="senha" name="senha" placeholder="Password" required>
                        </div>
                        <span id="erro-senha" class="erro-texto"></span>
                    </div>

                    <div class="remember-forgot">
                        <label><input type="checkbox"> Lembrar de mim</label>
                        <a href="#">Esqueceu a senha?</a>
                    </div>

                    <button type="submit" class="btn-login">Acessar Estufa</button>

                    <div class="register">
                        <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <script src="login.js"></script>
</body>

</html>
